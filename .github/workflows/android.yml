name: Build APK

# Compila l'APK sui server di GitHub (hanno SDK Android + rete).
# Parte a ogni push e puoi anche avviarlo a mano (Actions -> Build APK -> Run workflow).
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK (debug, installabili senza firma)
        run: gradle assembleIoDebug assembleAmiciDebug --no-daemon --stacktrace

      - name: Pubblica gli APK
        uses: actions/upload-artifact@v4
        with:
          name: FRN-Lite-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
